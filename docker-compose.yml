services:
  h264-timestamp-repair:
    build:
      context: .
    image: local/h264-timestamp-repair:3.0.2
    container_name: h264-timestamp-repair
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_ROOT: /media
      CONFIG_ROOT: /config
      WORK_ROOT: /work
      NAME_CONTAINS: "${NAME_CONTAINS:-}"
      AUTO_REPAIR: ${AUTO_REPAIR:-false}
      REPAIR_MKV_TIMESTAMPS: ${REPAIR_MKV_TIMESTAMPS:-true}
      REPAIR_EMPTY_FULL_CHAPTERS: ${REPAIR_EMPTY_FULL_CHAPTERS:-true}
      EMBY_URL: "${EMBY_URL:-}"
      EMBY_MEDIA_ROOT: "${EMBY_MEDIA_ROOT:-}"
      EMBY_API_KEY: "${EMBY_API_KEY:-}"
      EMBY_API_KEY_FILE: "${EMBY_API_KEY_FILE:-}"
      EMBY_REFRESH_RETRY_SECONDS: ${EMBY_REFRESH_RETRY_SECONDS:-60}
      EMBY_REFRESH_MAX_RETRY_SECONDS: ${EMBY_REFRESH_MAX_RETRY_SECONDS:-21600}
      MIN_FILE_AGE_SECONDS: ${MIN_FILE_AGE_SECONDS:-3600}
      FILE_SETTLE_SECONDS: ${FILE_SETTLE_SECONDS:-60}
      RECONCILE_LOCAL_TIME: "${RECONCILE_LOCAL_TIME:-04:00}"
      EVENT_HISTORY_LIMIT: ${EVENT_HISTORY_LIMIT:-5000}
      SAMPLE_SECONDS: ${SAMPLE_SECONDS:-8}
      MINIMUM_PACKETS: ${MINIMUM_PACKETS:-60}
      RETRY_FAILED_AFTER_SECONDS: ${RETRY_FAILED_AFTER_SECONDS:-86400}
      KEEP_TEMP_ON_FAILURE: ${KEEP_TEMP_ON_FAILURE:-false}
      WEB_UI_ENABLED: ${WEB_UI_ENABLED:-true}
      WEB_UI_HOST: 0.0.0.0
      WEB_UI_PORT: 8080
      WEB_SHOW_FULL_PATHS: ${WEB_SHOW_FULL_PATHS:-false}
    ports:
      - "${WEB_UI_BIND_ADDRESS:-0.0.0.0}:${WEB_UI_HOST_PORT:-8080}:8080"
    volumes:
      - ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH in .env}:/media:rw
      - ./config:/config:rw
      - ./work:/work:rw
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15m
    healthcheck:
      test: ["CMD", "python3", "/app/repair_service.py", "--healthcheck"]
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 10m
