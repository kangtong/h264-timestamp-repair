name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example 1.0.0
        required: true
        default: 3.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Docker Compose files
        env:
          MEDIA_HOST_PATH: /tmp/media
          WEB_UI_HOST_PORT: "18080"
        run: |
          mkdir -p /tmp/media
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.hub.yml config --quiet
          docker compose -f docker-compose.watchcow.yml config --quiet
      - name: Build application image
        run: docker build -t video-integrity-repair:test .
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/h264-timestamp-repair:${{ inputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/h264-timestamp-repair:latest
          provenance: true
          sbom: true
